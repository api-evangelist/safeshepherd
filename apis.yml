name: SafeShepherd
description: Safe Shepherd is a consumer privacy and identity-protection service that
  proactively removes an individual's personal information from the internet and from
  marketing and data-broker databases. It continuously scans public websites and private
  databases for a subscriber's personal data, sends real-time email alerts when records
  are found, and submits opt-out and deletion requests on the subscriber's behalf (with
  manual removal instructions where automated removal is not possible). Surfaced as a
  500 Global portfolio company and profiled in the API Evangelist network; the public
  site is a consumer product with no developer/API surface.
